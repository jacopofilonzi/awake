# Checks and tests on every push to main and every pull request; also called by release.yml before
# building anything. Never builds or publishes artifacts (that happens only on a vX.Y.Z tag).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The minimum Go version of the agent module, so it keeps building on older Go installs (Pi).
      - uses: actions/setup-go@v7
        with:
          go-version-file: agents/go/go.mod
          cache-dependency-path: agents/go/go.sum
      - run: npm ci
      - run: make check
      - run: make test

  # The ESP32 firmware needs no configuration file, so it compiles as is (the MKR one needs a config.h).
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      # The core (compilers included) is a few hundred MB: cache it, keyed on the pinned versions.
      - uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino15-${{ hashFiles('agents/esp32-d1-mini/awake-agent/sketch.yaml') }}
      - run: make -C agents/esp32-d1-mini bin
      - uses: actions/upload-artifact@v7
        with:
          name: esp32-d1-mini-firmware
          path: agents/esp32-d1-mini/dist/*.bin
