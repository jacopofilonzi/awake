# Checks and tests of the server, UI and shared code on every push to main and every pull request; also
# called by release.yml before building anything. Never builds or publishes artifacts (that happens only on
# a vX.Y.Z tag). Nothing about the agents runs here: they are checked locally (`make check` includes the
# Go agent) and whoever runs an agent builds and flashes it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # npm scripts, not `make check`/`make test`: those also run the Go agent's checks.
      - run: npm run check
      - run: npm test
