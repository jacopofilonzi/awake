<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efebe4" />
    <meta name="description" content="Awake: accendi i tuoi dispositivi da ovunque." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Awake</title>
    <script>
      // Apply the theme before the first paint (lib/theme.svelte.ts takes over afterwards).
      try {
        const c = localStorage.getItem("awake.theme");
        const dark = c === "dark" || (c !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
