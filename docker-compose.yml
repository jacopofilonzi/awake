# Runs the published image (built by .github/workflows/release.yml on every vX.Y.Z tag).
# AWAKE_VERSION in .env pins a version (e.g. 0.2.0 or 0.2); default: latest.
services:
  awake:
    image: ghcr.io/jacopofilonzi/awake:${AWAKE_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
