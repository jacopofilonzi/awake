# arduino-cli build profile: pinned board core and libraries, installed by arduino-cli on first compile.
# The Arduino IDE ignores this file: install the same versions from its Boards/Library managers.
default_profile: d1_mini32
profiles:
  d1_mini32:
    fqbn: esp32:esp32:d1_mini32:PartitionScheme=min_spiffs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
